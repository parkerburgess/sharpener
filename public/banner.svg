<svg width="2400" height="900" viewBox="0 0 2400 900" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
  <title id="title">Sharpener - Simplified Vector Banner</title>
  <desc id="desc">Clean minimalist ultra-wide banner with sharpening stone and keyboard keys</desc>
  
  <!-- Background - Lighter Gray -->
  <rect width="2400" height="900" fill="#4F5B66"/>

  <!-- Sharpening stone - long dark rectangle -->
  <rect x="120" y="220" width="2160" height="460" rx="30" ry="30" fill="#1F2528" stroke="#11181C" stroke-width="45"/>

  <!-- Subtle stone highlight -->
  <rect x="150" y="245" width="2100" height="410" rx="20" ry="20" fill="#2A3238" opacity="0.65"/>

  <!-- Keyboard keys group - centered -->
  <g transform="translate(520 375)">
    
    <!-- S (black key) -->
    <rect x="0" y="0" width="135" height="135" rx="10" ry="10" fill="#11181C" stroke="#EDEDED" stroke-width="14"/>
    <text x="68" y="88" font-family="Arial Black, sans-serif" font-size="82" font-weight="900" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">S</text>

    <!-- Remaining keys (light) -->
    <rect x="150" y="0" width="135" height="135" rx="10" ry="10" fill="#F5F5F5" stroke="#11181C" stroke-width="14"/>
    <text x="218" y="88" font-family="Arial Black, sans-serif" font-size="82" font-weight="900" fill="#11181C" text-anchor="middle" dominant-baseline="middle">H</text>

    <rect x="300" y="0" width="135" height="135" rx="10" ry="10" fill="#F5F5F5" stroke="#11181C" stroke-width="14"/>
    <text x="368" y="88" font-family="Arial Black, sans-serif" font-size="82" font-weight="900" fill="#11181C" text-anchor="middle" dominant-baseline="middle">A</text>

    <rect x="450" y="0" width="135" height="135" rx="10" ry="10" fill="#F5F5F5" stroke="#11181C" stroke-width="14"/>
    <text x="518" y="88" font-family="Arial Black, sans-serif" font-size="82" font-weight="900" fill="#11181C" text-anchor="middle" dominant-baseline="middle">R</text>

    <rect x="600" y="0" width="135" height="135" rx="10" ry="10" fill="#F5F5F5" stroke="#11181C" stroke-width="14"/>
    <text x="668" y="88" font-family="Arial Black, sans-serif" font-size="82" font-weight="900" fill="#11181C" text-anchor="middle" dominant-baseline="middle">P</text>

    <rect x="750" y="0" width="135" height="135" rx="10" ry="10" fill="#F5F5F5" stroke="#11181C" stroke-width="14"/>
    <text x="818" y="88" font-family="Arial Black, sans-serif" font-size="82" font-weight="900" fill="#11181C" text-anchor="middle" dominant-baseline="middle">E</text>

    <rect x="900" y="0" width="135" height="135" rx="10" ry="10" fill="#F5F5F5" stroke="#11181C" stroke-width="14"/>
    <text x="968" y="88" font-family="Arial Black, sans-serif" font-size="82" font-weight="900" fill="#11181C" text-anchor="middle" dominant-baseline="middle">N</text>

    <rect x="1050" y="0" width="135" height="135" rx="10" ry="10" fill="#F5F5F5" stroke="#11181C" stroke-width="14"/>
    <text x="1118" y="88" font-family="Arial Black, sans-serif" font-size="82" font-weight="900" fill="#11181C" text-anchor="middle" dominant-baseline="middle">E</text>

    <rect x="1200" y="0" width="135" height="135" rx="10" ry="10" fill="#F5F5F5" stroke="#11181C" stroke-width="14"/>
    <text x="1268" y="88" font-family="Arial Black, sans-serif" font-size="82" font-weight="900" fill="#11181C" text-anchor="middle" dominant-baseline="middle">R</text>
  </g>
</svg>